name: passiontech-erp

services:
  db:
    image: postgres@sha256:6eb0add3b77c081df18aa518ce43df58fdcc40f2e6d868a6fd08038dc7acd425
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  odoo:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: passiontech-erp:${RELEASE_REVISION:?set RELEASE_REVISION}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ODOO_HTTP_PORT:-8069}:8069"
      - "127.0.0.1:${ODOO_GEVENT_PORT:-8072}:8072"
    volumes:
      - odoo_data:/var/lib/odoo
      - ./runtime/odoo.conf:/etc/odoo/odoo.conf:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 90s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

volumes:
  postgres_data:
  odoo_data:
